# Python tooling quality contract for the repository-maintenance scripts.
# The distributed VBA source remains dependency-free; Ruff, mypy and coverage.py are CI/development tools only.
# mypy runs in strict mode over every module under tools/; Ruff caps McCabe complexity at 15.

[tool.ruff]
target-version = "py310"
# Formatting target only: E501 is not selected and CI does not run ruff format.
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I001", "C90", "S314"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.10"
files = ["tools"]
pretty = true
show_error_codes = true
warn_unused_configs = true
strict = true

# The unittest modules below keep unannotated test methods and fixture helpers,
# so only the annotate-every-def rules are relaxed for them; every other strict
# check still applies. mypy module globs match dotted packages only, so the
# top-level test modules are named explicitly; the remaining test_*.py modules
# are already fully annotated and stay under the complete strict bundle.
[[tool.mypy.overrides]]
module = ["test_documentation", "test_excel_evidence", "test_release_provenance"]
disallow_untyped_defs = false
disallow_untyped_calls = false

# Statement coverage of the maintained Python tooling, measured by the "Python
# tooling coverage" job in .github/workflows/static-checks.yml over the
# self-tests and a subset of the checks the Repository integrity job runs. The
# subprocess patch measures Python child processes started by the fixtures.
# fail_under is a ratchet set just below the measured baseline (81% at
# introduction): raise it as coverage improves and never lower it to make a
# change pass.
[tool.coverage.run]
source = ["tools"]
parallel = true
relative_files = true
patch = ["subprocess"]

[tool.coverage.report]
omit = ["tools/test_*.py"]
show_missing = true
fail_under = 80
