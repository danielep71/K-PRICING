version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
    labels:
      - "ci"
      - "tests"
    groups:
      # CodeQL refuses to run with init, analyze and upload-sarif at different
      # versions, so their pins must always move in one pull request
      codeql-action:
        patterns:
          - "github/codeql-action/*"
