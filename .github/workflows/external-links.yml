name: External documentation links
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: external-links-${{ github.ref }}
  cancel-in-progress: true
jobs:
  external-links:
    name: External link observations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Observe anonymous external references
        run: |
          python3 tools/check_external_links.py --root . --as-of "$(date -u +%F)" \
            --output test-results/external-links.json --summary test-results/external-links.md
      - name: Publish observations
        if: always()
        run: cat test-results/external-links.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-links-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/external-links.json
            test-results/external-links.md
          retention-days: 14
          if-no-files-found: error
