name: Wiki source checks
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wiki-source:
    name: Wiki source integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Exercise publication failure boundaries
        run: python tools/test_wiki.py -v
      - name: Check wiki source and complete inventory
        run: python tools/check_wiki.py --root . --output test-results/wiki-source.json --summary test-results/wiki-source.md
      - name: Export exact-source publication bundle
        env:
          WIKI_EXPORT: ${{ runner.temp }}/wiki-export
        run: python tools/check_wiki.py --root . --export-dir "$WIKI_EXPORT"
      - name: Retain reviewed publication candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wiki-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wiki-export
            test-results/wiki-source.json
            test-results/wiki-source.md
          if-no-files-found: error
          retention-days: 30
