name: Checker development contract
run-name: Checker development — ${{ github.ref_name }} @ ${{ github.sha }}

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checker-development-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checker-development:
    name: Checker development
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact SHA under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Exercise independent checker development contract
        id: self-test
        continue-on-error: true
        run: python3 tools/checker_development.py --root . --self-test

      - name: Publish checker development evidence
        id: evidence
        continue-on-error: true
        run: >-
          python3 tools/checker_development.py
          --root .
          --output test-results/checker-development.json
          --summary test-results/checker-development.md

      - name: Exercise semantic policy-coverage contract
        id: policy-coverage-self-test
        continue-on-error: true
        run: python3 tools/check_policy_coverage.py --root . --self-test

      - name: Publish semantic policy-coverage evidence
        id: policy-coverage
        continue-on-error: true
        run: >-
          python3 tools/check_policy_coverage.py
          --root .
          --output test-results/policy-coverage.json
          --summary test-results/policy-coverage.md

      - name: Add readable summary
        id: summary
        if: always()
        continue-on-error: true
        run: |
          for report in \
            test-results/checker-development.md \
            test-results/policy-coverage.md; do
            if [[ ! -f "$report" ]]; then
              echo "Required checker-maintenance summary was not produced: $report"
              exit 1
            fi
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload checker-development evidence
        id: artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checker-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/checker-development.json
            test-results/checker-development.md
            test-results/policy-coverage.json
            test-results/policy-coverage.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Enforce checker-development results
        if: always()
        env:
          SELF_TEST_OUTCOME: ${{ steps.self-test.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          POLICY_COVERAGE_SELF_TEST_OUTCOME: ${{ steps.policy-coverage-self-test.outcome }}
          POLICY_COVERAGE_OUTCOME: ${{ steps.policy-coverage.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: |
          failed=0
          for item in \
            "Checker-development self-test:$SELF_TEST_OUTCOME" \
            "Checker-development evidence:$EVIDENCE_OUTCOME" \
            "Policy-coverage self-test:$POLICY_COVERAGE_SELF_TEST_OUTCOME" \
            "Policy coverage:$POLICY_COVERAGE_OUTCOME" \
            "Job summary:$SUMMARY_OUTCOME" \
            "Evidence upload:$ARTIFACT_OUTCOME"; do
            name="${item%%:*}"
            outcome="${item#*:}"
            if [[ "$outcome" != "success" ]]; then
              echo "::error::$name outcome: $outcome"
              failed=1
            fi
          done
          exit "$failed"

  python-coverage:
    name: Python statement coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out the exact SHA under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install pinned coverage dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes
          -r tools/requirements-coverage-ci.txt

      - name: Exercise maintained Python tooling under coverage
        id: coverage
        continue-on-error: true
        run: |
          coverage erase
          mkdir -p test-results/coverage-normal
          run() { coverage run "$@"; }

          run tools/checker_development.py --root . --self-test
          run tools/check_repo.py --root . --self-test
          run tools/check_policy_coverage.py --root . --self-test
          run tools/check_release.py --root . --self-test
          run tools/check_release_semantics.py --root . --self-test
          run tools/check_template_contract.py --root . --self-test
          run tools/_release_closeout.py --self-test
          run tools/release_certification.py --self-test
          run tools/initialize_repository.py --root . --self-test
          run tools/check_committed_whitespace.py --root . --self-test
          run tools/check_vba_jumps.py --root . --self-test
          run tools/check_vba_conditionals.py --root . --self-test
          run tools/check_vba_public_api.py --root . --self-test
          run tools/check_local_actions.py --root . --self-test

          run tools/test_documentation.py -v
          run tools/test_excel_evidence.py -v
          run tools/test_portfolio_drift.py -v
          run tools/test_portfolio_quality.py -v
          run tools/test_provision_repository.py -v
          run tools/test_release_provenance.py -v
          run -m unittest discover -s tools -p 'test_workflow_validation.py' -v
          run tools/test_verification_depth.py -v
          run tools/test_wiki.py -v

          run tools/checker_development.py --root . \
            --output test-results/coverage-normal/checker-development.json \
            --summary test-results/coverage-normal/checker-development.md
          run tools/check_repo.py --root . \
            --output test-results/coverage-normal/check-repo.json \
            --summary test-results/coverage-normal/check-repo.md
          run tools/check_documentation.py --root . \
            --output test-results/coverage-normal/documentation.json \
            --summary test-results/coverage-normal/documentation.md
          run tools/check_release_semantics.py --root . \
            --output test-results/coverage-normal/release-semantics.json \
            --summary test-results/coverage-normal/release-semantics.md
          run tools/check_committed_whitespace.py --root . --mode committed \
            --head "$(git rev-parse HEAD)" \
            --output test-results/coverage-normal/committed-whitespace.json \
            --summary test-results/coverage-normal/committed-whitespace.md
          run tools/check_vba_jumps.py --root . \
            --output test-results/coverage-normal/vba-jumps.json \
            --summary test-results/coverage-normal/vba-jumps.md
          run tools/check_vba_conditionals.py --root . \
            --output test-results/coverage-normal/vba-conditionals.json \
            --summary test-results/coverage-normal/vba-conditionals.md
          run tools/check_vba_public_api.py --root . \
            --output test-results/coverage-normal/vba-public-api.json \
            --summary test-results/coverage-normal/vba-public-api.md
          run tools/check_local_actions.py --root . \
            --output test-results/coverage-normal/local-actions.json \
            --summary test-results/coverage-normal/local-actions.md
          run tools/check_template_contract.py --root . \
            --output test-results/coverage-normal/template-contract.json \
            --summary test-results/coverage-normal/template-contract.md
          run tools/check_wiki.py --root . \
            --output test-results/coverage-normal/wiki.json \
            --summary test-results/coverage-normal/wiki.md

          coverage combine
          coverage report | tee test-results/coverage-report.txt
          coverage json -o test-results/coverage.json

      - name: Add coverage summary
        id: coverage-summary
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## Python statement coverage"
            echo
            echo "- Candidate: \`$(git rev-parse HEAD)\`"
            echo "- Scope: maintained \`tools/*.py\`; \`tools/test_*.py\` excluded from the denominator."
            echo "- Python subprocesses spawned by the semantic fixtures are measured and combined."
            echo "- Floor: **95% statement coverage**."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f test-results/coverage-report.txt ]]; then
            {
              echo '```text'
              cat test-results/coverage-report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage report was not produced." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload coverage evidence
        id: coverage-artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/coverage-report.txt
            test-results/coverage.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Enforce coverage results
        if: always()
        env:
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
          SUMMARY_OUTCOME: ${{ steps.coverage-summary.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.coverage-artifact.outcome }}
        run: |
          failed=0
          for item in \
            "Coverage execution:$COVERAGE_OUTCOME" \
            "Coverage summary:$SUMMARY_OUTCOME" \
            "Coverage evidence upload:$ARTIFACT_OUTCOME"; do
            name="${item%%:*}"
            outcome="${item#*:}"
            if [[ "$outcome" != "success" ]]; then
              echo "::error::$name outcome: $outcome"
              failed=1
            fi
          done
          exit "$failed"
