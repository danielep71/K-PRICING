name: Keep milestones issue-only

# Milestones belong to issues only (docs/ISSUE_TRIAGE.md). Removes any
# milestone set on a pull request in a daily scan of every pull request, on a
# manual run, and when this file changes on the default branch.
# The repository gate prohibits pull_request_target, so the workflow does not
# react to each pull-request event: a milestone set on a pull request lasts
# until the next scan. The job never checks out or runs repository code.
# Each removal is read back with a separate GET, and the job summary lists
# every pull request and the milestone title removed from it.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pr-milestones.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

# Every run scans the whole collection, so a queued run replaces a pending one
# without losing work, and a running scan is never cancelled midway.
concurrency:
  group: pr-milestones-scan
  cancel-in-progress: false

jobs:
  reconcile:
    name: Remove PR milestone assignments
    # Manual runs use only the default branch's reviewed copy.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The script reads each pull request through the issues endpoint, which
      # needs issues: read on a private repository.
      issues: read
      pull-requests: write
    steps:
      # Trusted inline code only: no checkout, so no repository code runs.
      - name: Reconcile PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          def cell(value):
              # A milestone title is data: it must not end a table cell or
              # start a new row in the job summary.
              text = " ".join(str(value).splitlines())
              return text.replace("\\", "\\\\").replace("|", "\\|").replace("`", "\\`")

          def summary(removed, failure=None):
              lines = ["# PR milestone reconciliation", ""]
              if failure is not None:
                  lines += [f"**Failed:** {cell(failure)}", ""]
              if not removed:
                  lines.append("No milestone was removed.")
              else:
                  lines += [f"Removed {len(removed)} milestone assignment(s).", "",
                            "| Pull request | Removed milestone |", "| --- | --- |"]
                  lines += [f"| #{number} | {cell(title)} |" for number, title in removed]
              return "\n".join(lines) + "\n"

          def reconcile(request, repository, removed):
              def clear(number):
                  # Verify the live object before mutating the issues endpoint.
                  path = f"/repos/{repository}/issues/{number}"
                  item = request("GET", path)
                  if "pull_request" not in item:
                      raise ValueError("Refusing to change an issue")
                  milestone = item.get("milestone")
                  if milestone is not None:
                      result = request("PATCH", path, {"milestone": None})
                      if result.get("milestone") is not None:
                          raise ValueError(f"PR #{number} still has a milestone")
                      # Read the post-state back independently of the PATCH.
                      if request("GET", path).get("milestone") is not None:
                          raise ValueError(f"PR #{number} still has a milestone after the read-back")
                      title = milestone.get("title", "") if isinstance(milestone, dict) else ""
                      removed.append((number, title))
                      print(f"Removed milestone {title!r} from PR #{number}")

              # Traverse the full unfiltered PR collection in creation order so
              # mutations cannot shift pagination. This includes closed and
              # merged PRs and bots.
              for page in range(1, 101):
                  items = request("GET", f"/repos/{repository}/pulls?state=all&sort=created&direction=asc&per_page=100&page={page}")
                  if not isinstance(items, list):
                      raise ValueError("Malformed PR collection")
                  for item in items:
                      if item.get("milestone") is not None:
                          clear(int(item["number"]))
                  if len(items) < 100:
                      print("PR milestone reconciliation complete")
                      return
              raise ValueError("PR pagination exceeded 100 pages")

          def main():
              repository = os.environ["GITHUB_REPOSITORY"]

              def request(method, path, data=None):
                  headers = {
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  }
                  payload = None if data is None else json.dumps(data).encode()
                  req = Request(os.environ["GITHUB_API_URL"] + path, data=payload, headers=headers, method=method)
                  with urlopen(req, timeout=30) as response:
                      return json.load(response)

              # The summary lists every removal, also when a later step fails.
              removed, failure = [], None
              try:
                  reconcile(request, repository, removed)
              except Exception as error:
                  failure = f"{type(error).__name__}: {error}"
                  raise
              finally:
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
                      handle.write(summary(removed, failure))

          if __name__ == "__main__":
              main()
          PY
