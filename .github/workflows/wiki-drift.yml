name: Published wiki observations
on:
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wiki-drift:
    name: Published wiki comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Read public wiki and compare exact source
        env:
          WIKI_REPOSITORY: ${{ github.repository }}
          WIKI_READBACK: ${{ runner.temp }}/wiki-readback
          GIT_TERMINAL_PROMPT: "0"
        run: |
          mkdir -p test-results
          if ! timeout 60s git clone --depth 1 "https://github.com/${WIKI_REPOSITORY}.wiki.git" "$WIKI_READBACK" >test-results/wiki-fetch.txt 2>&1; then
            echo 'UNAVAILABLE: public wiki fetch failed; page correctness is unverified.' >test-results/wiki-observation.md
            exit 1
          fi
          if python tools/check_wiki.py --root . --published-dir "$WIKI_READBACK" --output test-results/wiki-drift.json --summary test-results/wiki-drift.md; then
            echo 'PASS: published pages match the checked source commit.' >test-results/wiki-observation.md
          else
            echo 'DRIFT: fetched publication does not satisfy the checked source contract; inspect findings.' >test-results/wiki-observation.md
            exit 1
          fi
      - name: Retain observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wiki-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/wiki-*
          if-no-files-found: error
          retention-days: 30
