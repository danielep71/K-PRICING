name: Sync issue labels

# Pull requests validate without write permission. Only a trusted push to main
# or a manual dispatch of the default branch can reconcile the live repository
# taxonomy: a dispatch of any other ref skips reconciliation, so an unmerged
# manifest or script never changes the live labels.
# The workflow self-tests the script, and the script validates the manifest
# before the first API mutation, then verifies an exact post-run match.
# A label outside the manifest is pruned only when no issue or pull request,
# open or closed, still carries it; otherwise the run fails before any change.

on:
  pull_request:
    branches:
      - main
      - "release/**"
    paths:
      - .github/labels.json
      - .github/repository-profile.json
      - .github/scripts/labels-sync.mjs
      - .github/scripts/markdown-summary.mjs
      - .github/workflows/labels-sync.yml
  push:
    branches:
      - main
    paths:
      - .github/labels.json
      - .github/repository-profile.json
      - .github/scripts/labels-sync.mjs
      - .github/scripts/markdown-summary.mjs
      - .github/workflows/labels-sync.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labels-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate label manifest
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out the exact SHA under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          package-manager-cache: false

      - name: Exercise validation, overlays, and reconciliation paths
        run: node .github/scripts/labels-sync.mjs --self-test

      - name: Validate the canonical manifest
        run: node .github/scripts/labels-sync.mjs --mode validate

  reconcile:
    name: Reconcile live labels
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      # The prune protection lists the pull requests that carry a label.
      pull-requests: read

    steps:
      - name: Check out the exact SHA to apply
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          package-manager-cache: false

      - name: Exercise validation, overlays, and reconciliation paths
        run: node .github/scripts/labels-sync.mjs --self-test

      - name: Reconcile and verify the versioned label selection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/labels-sync.mjs --mode reconcile --repository "${GITHUB_REPOSITORY}"
