name: "✨ Feature request"
description: "Propose a bounded capability or supported-contract improvement."
title: "[Feature]: "
labels: ["enhancement", "P3"]
assignees: ["danielep71"]
body:
  - type: markdown
    attributes:
      value: |
        Define the desired outcome and acceptance evidence before prescribing implementation. Triage sets the milestone and confirms the priority, `P3` by default.

        Do not include vulnerabilities, credentials, private workbooks, or restricted data. Follow `SECURITY.md` for private security reporting.

  - type: dropdown
    id: profile
    attributes:
      label: Applicable area
      description: Select the narrowest area that should own this capability.
      options:
        - Date library (src/)
        - Examples and demo sheets
        - Tests and fixtures
        - Repository tooling and CI
        - Documentation
        - Several areas
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem and user
      description: Explain the unmet need, affected user, and why current behavior is insufficient.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Proposed supported outcome
      description: State observable behavior, public surface, errors, state ownership, and limitations as applicable.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Provide independently verifiable completion conditions.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals and boundaries
      description: Identify adjacent behavior deliberately excluded from this request.
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration
      description: Describe affected callers, signatures, results, errors, state, packaging, platforms, and migration needs. State none when applicable.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Summarize existing workarounds or smaller designs and why they are insufficient.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation and evidence plan
      description: Identify static, regression, Excel-host, specialist, and release evidence needed to certify the outcome.
    validations:
      required: true

  - type: input
    id: target_end_date
    attributes:
      label: Target end date (Europe/Rome)
      description: ISO calendar date YYYY-MM-DD, earlier than the due date of the milestone. Triage sets the milestone and checks the date against it.
      placeholder: "YYYY-MM-DD"
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blocking status
      description: Name each prerequisite this work depends on as an issue link (#12), or on a line starting "External condition:". Do not list issues that depend on this one. Write "None" if nothing blocks this work. Triage adds `blocked` only while a named prerequisite is unresolved.
      placeholder: None
    validations:
      required: true

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Submission checks
      options:
        - label: I searched open and closed issues and did not find an equivalent proposal.
          required: true
        - label: I separated required behavior from optional implementation preferences.
          required: true
        - label: This proposal contains no vulnerability details, secrets, private links, or restricted data.
          required: true
