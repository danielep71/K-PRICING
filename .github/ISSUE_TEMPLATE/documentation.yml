name: "📖 Documentation request"
description: "Report incorrect, stale, missing, inaccessible, or unclear maintained documentation."
title: "[Docs]: "
labels: ["documentation", "P3"]
assignees: ["danielep71"]
body:
  - type: markdown
    attributes:
      value: |
        Documentation must match supported behavior and reproducible evidence. Triage sets the milestone and confirms the priority, `P3` by default.

        Do not disclose vulnerabilities, credentials, private workbooks, or restricted data. Follow `SECURITY.md` for private security reporting.

  - type: input
    id: location
    attributes:
      label: Document and location
      description: Identify the file, heading, anchor, or public page. Use a stable link when available.
      placeholder: README.md — Installation / https://github.com/owner/repository/blob/commit/README.md
    validations:
      required: true

  - type: dropdown
    id: problem_type
    attributes:
      label: Documentation problem
      options:
        - Incorrect behavior or contract
        - Stale version, count, command, or evidence
        - Missing explanation or example
        - Unclear wording or navigation
        - Broken link or asset
        - Accessibility or rendering problem
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Current problem and impact
      description: Quote only the minimum necessary text and explain how it misleads or blocks the reader.
    validations:
      required: true

  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
      description: Describe the corrected outcome, example, navigation, or wording.
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Authoritative source or contract
      description: Link the source code, issue, release, standard, or evidence that establishes the correction. State not applicable when appropriate.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Explain how to verify commands, links, examples, rendering, counts, and cross-document consistency.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable conditions that show the documentation is corrected.
      placeholder: |
        - [ ] ...
    validations:
      required: true

  - type: input
    id: target_end_date
    attributes:
      label: Target end date (Europe/Rome)
      description: ISO calendar date YYYY-MM-DD, earlier than the due date of the milestone. Triage sets the milestone and checks the date against it.
      placeholder: "YYYY-MM-DD"
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blocking status
      description: Name each prerequisite this work depends on as an issue link (#12), or on a line starting "External condition:". Do not list issues that depend on this one. Write "None" if nothing blocks this work. Triage adds `blocked` only while a named prerequisite is unresolved.
      placeholder: None
    validations:
      required: true

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Submission checks
      options:
        - label: I checked the current default-branch documentation and searched related issues.
          required: true
        - label: This request contains no vulnerability details, secrets, private links, or restricted data.
          required: true
